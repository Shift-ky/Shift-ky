name: Generate Snake Animation

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository for profile cards
        uses: actions/checkout@v4
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Shift-ky
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2306b6d4&color_dots=%23ebedf0,%239be9a8,%2340c463,%2330a14e,%23216e39
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2322d3ee
      - name: Generate self-hosted stats and languages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/generate_cards.py
      - name: Verify generated snake SVGs
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for name in ("github-contribution-grid-snake.svg", "github-contribution-grid-snake-dark.svg"):
              path = Path("dist") / name
              root = ET.parse(path).getroot()
              assert root.tag == "{http://www.w3.org/2000/svg}svg", f"Invalid SVG: {path}"
              assert "@keyframes" in path.read_text(), f"Missing animation: {path}"
          PY
      - name: Publish snake animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
